# kiln-microspool's Moonraker part (Kiln OS includes it while the plugin is
# on, after your moonraker.conf). It starts microspool and points
# Moonraker's Spoolman support at it.

# Options (README.md): host, port, data_file, binary, extra_args
[microspool]

# Moonraker, Fluidd, HelixScreen and kiln-spoolman use microspool like a
# Spoolman server. This replaces a [spoolman] server: in your own
# moonraker.conf while the plugin is on (use one or the other).
[spoolman]
server: http://127.0.0.1:7912

[update_manager kiln-microspool]
type: git_repo
path: /data/ad5x/plugins/microspool
origin: https://github.com/djvalic/kiln-microspool.git
primary_branch: main
is_system_service: False
# A new microspool binary or component runs after Moonraker restarts
managed_services: moonraker
